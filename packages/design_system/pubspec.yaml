name: meupet_design_system
description: Tokens, theme and UI components of the MeuPet+ app.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Fontes do design system MeuPet+ (Poppins e Inter, licença OFL).
  # Ficam dentro do pacote; os estilos usam package: 'meupet_design_system'.
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter_400Regular.ttf
          weight: 400
        - asset: fonts/Inter_500Medium.ttf
          weight: 500
        - asset: fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_700Bold.ttf
          weight: 700
